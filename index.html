<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Formula Searcher</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel2: #232734;
    --accent: #5b9dff;
    --accent2: #7ee787;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --border: #2c3140;
    --hl: #ffd86b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 12px;
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .search-wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  #search {
    width: 100%;
    padding: 16px 18px;
    font-size: 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  .chips {
    max-width: 720px;
    margin: 14px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .chip {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .12s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .count {
    max-width: 860px;
    margin: 24px auto 8px;
    padding: 0 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .grid {
    max-width: 860px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .card .cat {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card h3 { margin: 0 0 10px; font-size: 16px; }
  .formula {
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    background: var(--panel2);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow-x: auto;
  }
  .vars { display: flex; flex-wrap: wrap; gap: 6px; }
  .var {
    font-size: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .12s, background .12s, color .12s;
  }
  .var:hover { border-color: var(--accent); color: var(--text); }
  .var b { color: var(--text); font-weight: 600; }
  .var.match { border-color: var(--hl); background: rgba(255,216,107,.12); }
  .var.match b, .var.match { color: var(--hl); }
  mark { background: rgba(255,216,107,.35); color: var(--hl); padding: 0 2px; border-radius: 3px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .var .unit { color: var(--accent); font-size: 11px; margin-left: 4px; opacity: .85; }
  .toolbar {
    max-width: 720px; margin: 12px auto 0; display: flex; gap: 10px;
    justify-content: center; align-items: center; flex-wrap: wrap;
  }
  .toolbar label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .toolbar select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  .calc-btn {
    margin-top: 12px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--accent2); border-radius: 8px; padding: 7px 12px; font-size: 13px;
    cursor: pointer; transition: all .12s;
  }
  .calc-btn:hover { border-color: var(--accent2); }
  .calc { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: none; }
  .calc.open { display: block; }
  .calc-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .calc-row .lbl { font-size: 13px; color: var(--muted); }
  .calc-row .lbl b { color: var(--text); }
  .calc-row .lbl .u { color: var(--accent); font-size: 11px; }
  .calc-row input {
    width: 130px; padding: 6px 9px; font-size: 14px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
    font-family: "SF Mono", Menlo, monospace;
  }
  .calc-row input:focus { border-color: var(--accent); }
  .calc-row input.solved { border-color: var(--accent2); background: rgba(126,231,135,.10); color: var(--accent2); }
  .calc-row input.const { color: var(--muted); }
  .calc-actions { display: flex; gap: 8px; margin-top: 4px; }
  .calc-actions button {
    border-radius: 7px; padding: 7px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--border);
  }
  .calc-solve { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  .calc-clear { background: transparent; color: var(--muted); }
  .calc-hint { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .calc-err { color: #ff8b8b; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="search-wrap">
    <input id="search" type="text" autocomplete="off" autofocus>
  </div>
  <div class="chips" id="chips"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="symMode"> <span id="lblSym"></span></label>
    <label><input type="checkbox" id="calcMode"> <span id="lblCalc"></span></label>
    <label><span id="lblCat"></span> <select id="catFilter"></select></label>
    <label><span id="lblLang"></span>
      <select id="langSel">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
      </select>
    </label>
  </div>
</header>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const chipsEl = document.getElementById('chips');
const symModeEl = document.getElementById('symMode');
const calcModeEl = document.getElementById('calcMode');
const catFilterEl = document.getElementById('catFilter');
const langSelEl = document.getElementById('langSel');

const CAT_LIST = [...new Set(FORMULAS.map(f => f.cat))].sort();
const popular = ["displacement","velocity","force","energy","time","mass","acceleration","momentum","power","charge","frequency"];

// (Re)build the category dropdown and chip suggestions in the active language.
function buildControls(){
  catFilterEl.innerHTML = '<option value="">' + esc(t('all')) + '</option>' +
    CAT_LIST.map(cat => '<option value="' + esc(cat) + '">' + esc(catLabel(cat)) + '</option>').join('');
  chipsEl.innerHTML = '';
  popular.forEach(p => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = varLabel(p);
    c.onclick = () => { searchEl.value = varLabel(p); if(symModeEl.checked) symModeEl.checked = false; render(); };
    chipsEl.appendChild(c);
  });
}

function esc(s){ return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function highlight(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i === -1) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}

// Strip subscripts/primes/diacritics to get a symbol's base for matching.
function baseSymbol(sym){
  return sym
    .normalize('NFD').replace(/[̀-ͯ]/g,'')      // combining marks (v̄)
    .split(/[_₀₁₂₃₄₅₆₇₈₉ₛₒ'½]/)[0]                          // subscript boundary
    .replace(/[₀-₉]/g,'')
    .trim();
}
function symMatch(sym, q){
  if(!q) return false;
  const s = sym.toLowerCase(), b = baseSymbol(sym).toLowerCase(), ql = q.toLowerCase();
  return s === ql || b === ql || s.startsWith(ql) || b === ql;
}

function nameMatch(nm, q){ return nm.toLowerCase().includes(q) || varLabel(nm).toLowerCase().includes(q); }
function varMatches(f, q, symMode){
  return f.vars.some(([sym,nm]) => symMode ? symMatch(sym, q) : (nameMatch(nm, q) || sym.toLowerCase() === q));
}
function matches(f, q, symMode){
  if(!q) return true;
  if(!symMode && (f.name.toLowerCase().includes(q) || fnameLabel(f.name).toLowerCase().includes(q))) return true;
  return varMatches(f, q, symMode);
}

function fmt(x){
  if(!isFinite(x)) return '—';
  if(x === 0) return '0';
  const a = Math.abs(x);
  if(a >= 1e6 || a < 1e-4) return x.toExponential(4);
  return parseFloat(x.toPrecision(6)).toString();
}

function render(){
  const raw = searchEl.value || '';
  const symMode = symModeEl.checked;
  const q = symMode ? raw.trim() : raw.trim().toLowerCase();
  const cat = catFilterEl.value;
  let results = FORMULAS.filter(f => matches(f, q, symMode));
  if(cat) results = results.filter(f => f.cat === cat);

  if(results.length === 0){
    countEl.textContent = '';
    grid.innerHTML = '<div class="empty">' + esc(t('noResults')) + (q ? ' ' + esc(t('forWord')) + ' “' + esc(raw) + '”' : '') +
      '. ' + esc(symMode ? t('trySym') : t('tryName')) + '.</div>';
    return;
  }

  countEl.textContent = results.length + ' ' + (results.length === 1 ? t('formula') : t('formulas')) +
    (q ? ' · “' + raw + '”' : '') + (cat ? ' · ' + catLabel(cat) : '');

  grid.innerHTML = results.map((f, idx) => {
    const i = FORMULAS.indexOf(f);
    const varsHtml = f.vars.map(([sym,nm]) => {
      const isMatch = q && (symMode ? symMatch(sym, q) : (nameMatch(nm, q) || sym.toLowerCase() === q));
      const u = unitFor(nm);
      const label = varLabel(nm);
      return '<span class="var' + (isMatch ? ' match' : '') + '" data-name="' + esc(nm) + '" title="' + esc(label) + '"><b>' + esc(sym) + '</b> ' +
        (symMode ? esc(label) : highlight(label, isMatch ? q : '')) +
        (u ? '<span class="unit">' + esc(u) + '</span>' : '') + '</span>';
    }).join('');
    const solver = SOLVERS[f.name];
    const calcBtn = (calcModeEl.checked && solver) ? '<button class="calc-btn" data-calc="'+i+'">🧮 ' + esc(t('calculator')) + '</button>' : '';
    const calcBox = (calcModeEl.checked && solver) ? buildCalc(f, i, solver) : '';
    return '<div class="card">' +
      '<span class="cat">' + esc(catLabel(f.cat)) + '</span>' +
      '<h3>' + (symMode ? esc(fnameLabel(f.name)) : highlight(fnameLabel(f.name), q)) + '</h3>' +
      '<div class="formula">' + esc(f.expr) + '</div>' +
      '<div class="vars">' + varsHtml + '</div>' +
      calcBtn + calcBox +
    '</div>';
  }).join('');
}

function buildCalc(f, i, solver){
  const consts = solver.consts || {};
  const rows = f.vars.map(([sym,nm]) => {
    const u = unitFor(nm);
    const cv = consts[sym];
    const solvable = !!solver.solve[sym];
    const conv = CONV[u];
    const sel = (conv && conv.length > 1)
      ? '<select class="unit-sel" data-for="' + esc(sym) + '">' +
          conv.map(([lbl,fac]) => '<option value="' + fac + '">' + esc(lbl) + '</option>').join('') +
        '</select>'
      : (u ? '<span class="u-fixed">' + esc(u) + '</span>' : '');
    return '<div class="calc-row">' +
      '<span class="lbl"><b>' + esc(sym) + '</b> ' + esc(varLabel(nm)) +
        (solvable ? '' : ' <span class="u">· ' + esc(t('inputOnly')) + '</span>') + '</span>' +
      '<span class="calc-inwrap"><input type="text" inputmode="decimal" data-sym="' + esc(sym) + '"' +
        (cv !== undefined ? ' value="' + cv + '" class="const"' : '') + ' placeholder="?">' + sel + '</span>' +
    '</div>';
  }).join('');
  return '<div class="calc" id="calc-' + i + '">' +
    '<div class="calc-hint">' + esc(t('calcHint')) + '</div>' +
    rows +
    '<div class="calc-actions"><button class="calc-solve" data-solve="' + i + '">' + esc(t('solve')) + '</button>' +
    '<button class="calc-clear" data-clear="' + i + '">' + esc(t('clear')) + '</button></div>' +
    '<div class="calc-err" id="err-' + i + '"></div></div>';
}

function doSolve(i){
  const f = FORMULAS[i], solver = SOLVERS[f.name];
  const box = document.getElementById('calc-' + i);
  const err = document.getElementById('err-' + i);
  err.textContent = '';
  const factorOf = inp => { const s = box.querySelector('select[data-for="' + cssEsc(inp.dataset.sym) + '"]'); return s ? Number(s.value) : 1; };
  const inputs = [...box.querySelectorAll('input[data-sym]')];
  const vals = {}; const blanks = [];
  inputs.forEach(inp => {
    inp.classList.remove('solved');
    const raw = inp.value.trim();
    if(raw === ''){ blanks.push(inp); }
    else {
      const v = Number(raw);
      if(isNaN(v)){ blanks.push(inp); inp.classList.add('badval'); }
      else vals[inp.dataset.sym] = v * factorOf(inp);   // → SI
    }
  });
  if(blanks.length === 0){ err.textContent = t('errNoBlank'); return; }
  if(blanks.length > 1){ err.textContent = t('errManyBlank').replace('{n}', blanks.length); return; }
  const target = blanks[0], sym = target.dataset.sym;
  const fn = solver.solve[sym];
  if(!fn){ err.textContent = t('errNoSolve').replace('{s}', sym); return; }
  let res;
  try { res = fn(vals); } catch(e){ err.textContent = t('errCompute'); return; }
  if(res === undefined || isNaN(res) || !isFinite(res)){ err.textContent = t('errUndef'); return; }
  target.value = fmt(res / factorOf(target));   // SI → chosen output unit
  target.classList.add('solved');
}

function clearCalc(i){
  const box = document.getElementById('calc-' + i);
  const solver = SOLVERS[FORMULAS[i].name];
  const consts = solver.consts || {};
  document.getElementById('err-' + i).textContent = '';
  box.querySelectorAll('input[data-sym]').forEach(inp => {
    inp.classList.remove('solved');
    const sym = inp.dataset.sym;
    inp.value = consts[sym] !== undefined ? consts[sym] : '';
  });
}

grid.addEventListener('click', e => {
  const vb = e.target.closest('.var');
  if(vb){
    if(symModeEl.checked) symModeEl.checked = false;
    searchEl.value = varLabel(vb.dataset.name);
    searchEl.placeholder = t('phName');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const cb = e.target.closest('[data-calc]');
  if(cb){ document.getElementById('calc-' + cb.dataset.calc).classList.toggle('open'); return; }
  const sb = e.target.closest('[data-solve]');
  if(sb){ doSolve(+sb.dataset.solve); return; }
  const xb = e.target.closest('[data-clear]');
  if(xb){ clearCalc(+xb.dataset.clear); return; }
});

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t('title');
  document.getElementById('sub').textContent = t('sub');
  document.getElementById('lblSym').textContent = t('symMode');
  document.getElementById('lblCalc').textContent = t('calcMode');
  document.getElementById('lblCat').textContent = t('category');
  document.getElementById('lblLang').textContent = t('lang');
  searchEl.placeholder = symModeEl.checked ? t('phSym') : t('phName');
  const prevCat = catFilterEl.value;
  buildControls();
  catFilterEl.value = prevCat;
  render();
}

searchEl.addEventListener('input', render);
symModeEl.addEventListener('change', () => { searchEl.placeholder = symModeEl.checked ? t('phSym') : t('phName'); render(); });
calcModeEl.addEventListener('change', render);
catFilterEl.addEventListener('change', render);
langSelEl.addEventListener('change', () => {
  lang = langSelEl.value;
  try { localStorage.setItem('pf_lang', lang); } catch(e){}
  applyLang();
});

langSelEl.value = lang;
applyLang();
</script>
</body>
</html>
